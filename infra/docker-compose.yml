services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: liefero
      POSTGRES_PASSWORD: liefero
      POSTGRES_DB: liefero
    ports: ["5432:5432"]
    volumes: ["liefero-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liefero"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  liefero-pg:
